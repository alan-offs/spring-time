<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SpringTime">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- dial ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fcfcfb" stroke-width="26"/>
  <!-- hour ticks -->
  <g stroke="#fcfcfb" stroke-linecap="round">
    <line x1="256" y1="126" x2="256" y2="106" stroke-width="10"/>
    <line x1="321" y1="143.4" x2="331" y2="126.1" stroke-width="7"/>
    <line x1="368.6" y1="191" x2="385.9" y2="181" stroke-width="7"/>
    <line x1="386" y1="256" x2="406" y2="256" stroke-width="10"/>
    <line x1="368.6" y1="321" x2="385.9" y2="331" stroke-width="7"/>
    <line x1="321" y1="368.6" x2="331" y2="385.9" stroke-width="7"/>
    <line x1="256" y1="386" x2="256" y2="406" stroke-width="10"/>
    <line x1="191" y1="368.6" x2="181" y2="385.9" stroke-width="7"/>
    <line x1="143.4" y1="321" x2="126.1" y2="331" stroke-width="7"/>
    <line x1="126" y1="256" x2="106" y2="256" stroke-width="10"/>
    <line x1="143.4" y1="191" x2="126.1" y2="181" stroke-width="7"/>
    <line x1="191" y1="143.4" x2="181" y2="126.1" stroke-width="7"/>
  </g>
  <!-- hands, posed at 10:10 -->
  <g stroke="#fcfcfb" stroke-linecap="round" fill="none">
    <line x1="256" y1="256" x2="178" y2="201" stroke-width="28"/>
    <line x1="256" y1="256" x2="369" y2="191" stroke-width="24"/>
  </g>
  <!-- second hand + hub -->
  <line x1="256" y1="256" x2="336" y2="371" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="17" fill="#fbbf24"/>
</svg>
