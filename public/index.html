<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpringTime</title>
<meta name="description" content="Track working time per project.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#FFFBFE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpringTime">
<link rel="stylesheet" href="/style.css">
</head>
<body class="is-loading">
<div class="wrap">
  <header>
    <div class="brand">SpringTime <span id="scope"></span></div>
    <div id="project-picker"></div>
    <button id="theme-toggle" class="btn-icon state" aria-label="Toggle colour theme" data-tip="Toggle theme">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>
      </svg>
    </button>
    <button id="signin-btn" class="btn-outlined state signin" hidden>
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58Z"/>
      </svg>
      Sign in
    </button>
    <button id="avatar-btn" class="avatar state" hidden aria-haspopup="dialog" data-tip="Account"></button>
  </header>

  <div class="wip-bar" id="wip-bar" hidden>
    <button id="wip-set-btn" class="btn-text state" hidden>Set WIP sheet</button>
    <button id="wip-title" class="wip-title state" hidden data-tip="Change the WIP sheet"></button>
  </div>

  <div class="banner" id="error-banner" role="alert" hidden>
    <span class="msg"><strong>Couldn't load your time data.</strong> <span id="error-text"></span></span>
    <button id="retry-btn" class="btn-text state">Retry</button>
  </div>

  <div class="banner info" id="update-banner" role="status" hidden>
    <span class="msg"><strong>Update available.</strong> <span id="update-text"></span></span>
    <button id="update-btn" class="btn-text state">Update now</button>
  </div>

  <section class="timer" aria-label="Timer">
    <span class="dot" id="timer-dot" style="background: var(--md-on-surface-variant)"></span>
    <div class="fields">
      <div class="field dense">
        <input id="project-input" placeholder=" " autocomplete="off">
        <label for="project-input">Project</label>
      </div>
      <div class="field dense desc">
        <input id="desc-input" placeholder=" ">
        <label for="desc-input">What are you working on?</label>
      </div>
      <div class="field dense tags">
        <input id="tags-input" placeholder=" ">
        <label for="tags-input">Tags</label>
      </div>
    </div>
    <div class="since" id="since" hidden>
      <span>since</span>
      <input type="text" id="start-time" aria-label="Adjust the start time of the running timer">
    </div>
    <div class="elapsed idle" id="elapsed" aria-live="polite">0:00:00</div>
    <button class="btn-primary state" id="toggle-btn">Start</button>
  </section>

  <section class="tiles">
    <div class="tile hero"><div class="label">Today</div><div class="value" id="stat-today">—</div></div>
    <div class="tile"><div class="label">This week</div><div class="value" id="stat-week">—</div></div>
    <div class="tile"><div class="label" id="stat-range-label">Range total</div><div class="value" id="stat-range">—</div></div>
    <div class="tile"><div class="label">Daily average</div><div class="value" id="stat-avg">—</div></div>
  </section>

  <div class="filters" role="group" aria-label="Date range">
    <button class="chip state" data-range="today">Today</button>
    <button class="chip state" data-range="week" aria-pressed="true">Weekly</button>
    <button class="chip state" data-range="month">Monthly</button>
    <span class="spacer"></span>
    <button id="add-btn" class="btn-outlined state">Add entry</button>
    <button id="export-btn" class="btn-text state" data-tip="Download the current range as CSV">Export CSV</button>
    <button id="report-btn" class="btn-text state" data-tip="Build today's standup report">Daily report</button>
  </div>

  <section class="charts">
    <div class="card">
      <h2 id="daily-title">Hours per day</h2>
      <div class="sub" id="daily-sub">&nbsp;</div>
      <div id="daily-chart" class="chart-host"></div>
      <div class="tooltip" id="daily-tip" role="status"></div>
    </div>
    <div class="card">
      <h2 id="project-title">Time by project</h2>
      <div class="sub" id="project-sub">&nbsp;</div>
      <div id="project-chart" class="chart-host"></div>
      <div class="tooltip" id="project-tip" role="status"></div>
      <div class="legend" id="project-legend"></div>
    </div>
  </section>

  <section class="card">
    <h2>Entries</h2>
    <div class="sub" id="entries-sub">&nbsp;</div>
    <div id="entries-table"></div>
  </section>
</div>

<dialog id="entry-dialog" aria-labelledby="dialog-title">
  <form method="dialog" id="entry-form">
    <h2 id="dialog-title">Add entry</h2>
    <div class="field">
      <input name="project" required placeholder=" " id="f-project" autocomplete="off">
      <label for="f-project">Project</label>
    </div>
    <div class="field">
      <input name="description" placeholder=" " id="f-desc">
      <label for="f-desc">Description</label>
    </div>
    <button type="button" class="switch" id="duration-switch" role="switch" aria-checked="false">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span>Enter duration instead</span>
    </button>
    <div class="row">
      <div class="field">
        <input type="text" name="date" required placeholder=" " id="f-date">
        <label for="f-date">Date</label>
      </div>
      <div class="field" id="field-start">
        <input type="text" name="start" required placeholder=" " id="f-start">
        <label for="f-start">Start</label>
      </div>
      <div class="field" id="field-end">
        <input type="text" name="end" required placeholder=" " id="f-end">
        <label for="f-end">End</label>
      </div>
      <div class="field" id="field-duration-h" hidden>
        <input type="text" inputmode="numeric" name="durationH" placeholder=" " id="f-duration-h">
        <label for="f-duration-h">Hours</label>
      </div>
      <div class="field" id="field-duration-m" hidden>
        <input type="text" inputmode="numeric" name="durationM" placeholder=" " id="f-duration-m">
        <label for="f-duration-m">Minutes</label>
      </div>
    </div>
    <div class="field">
      <input name="tags" placeholder=" " id="f-tags">
      <label for="f-tags">Tags</label>
    </div>
    <p class="dialog-error" id="dialog-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="dialog-cancel" class="btn-text state">Cancel</button>
      <button type="submit" class="btn-primary state" id="dialog-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="report-dialog" aria-labelledby="report-title">
  <h2 id="report-title">Daily report</h2>
  <div class="sub" id="report-sub">&nbsp;</div>
  <div id="report-list"></div>
  <div class="report-total" id="report-total" hidden>
    <span>Total time</span>
    <span class="report-total-value" id="report-total-value"></span>
  </div>
  <label class="report-preview-label" for="report-preview">Preview</label>
  <textarea id="report-preview" rows="5" spellcheck="false"></textarea>
  <div class="dialog-actions">
    <button type="button" id="report-close" class="btn-text state">Close</button>
    <button type="button" id="report-copy" class="btn-text state">Copy</button>
    <button type="button" id="report-wip-btn" class="btn-primary state" hidden data-tip="Write this preview into column D of your row">Report WIP</button>
  </div>
</dialog>

<dialog id="account-dialog" aria-labelledby="account-name">
  <div class="account">
    <div class="avatar lg" id="account-avatar" aria-hidden="true"></div>
    <h2 id="account-name">Signed in</h2>
    <p class="account-email" id="account-email"></p>
  </div>
  <div class="dialog-actions">
    <button type="button" id="account-close" class="btn-text state">Close</button>
    <button type="button" id="logout-btn" class="btn-text state logout">Log out</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
